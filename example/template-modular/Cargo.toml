[package]
name = "template-modular"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "template-modular"
publish = false

[[bin]]
name = "template-modular-manage"
path = "src/bin/manage.rs"

[features]
default = ["sqlite"]
sqlite = ["che-orm/sqlite"]
postgres = ["che-orm/postgres"]

[dependencies]
che-orm = { path = "../..", version = "0.5.0", default-features = false }
app_tasks = { package = "template-modular-app-tasks", path = "apps/tasks" }
toml_edit = "0.25"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
