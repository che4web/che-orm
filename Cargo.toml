[package]
name = "che-orm"
version = "0.5.0"
edition = "2024"
description = "Typed SQLite and PostgreSQL ORM for che-rest applications"
license = "MIT"
repository = "https://github.com/che4web/che-orm"
homepage = "https://github.com/che4web/che-orm"
documentation = "https://docs.rs/che-orm"
rust-version = "1.89"
keywords = ["orm", "sqlite", "postgres", "database"]
categories = ["database"]

[workspace]
members = [
    "che-orm-macros",
    "che-sync-protocol",
    "che-sync",
    "example/orm-api",
    "example/template-single",
    "example/template-modular",
]

[features]
default = ["sqlite"]
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres", "dep:postgres-native-tls", "dep:native-tls"]
sqlite = ["dep:deadpool", "dep:deadpool-sync", "dep:rusqlite"]

[dependencies]
che-orm-macros = { version = "0.4.0", path = "che-orm-macros" }
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", optional = true, features = ["with-uuid-1", "with-time-0_3"] }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
deadpool = { version = "0.13", optional = true, default-features = false, features = ["managed", "rt_tokio_1"] }
deadpool-sync = { version = "0.2", optional = true }
rusqlite = { version = "0.41.1", optional = true, features = ["bundled", "time", "hooks", "uuid", "collation", "functions"] }
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde-human-readable", "serde-well-known"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
trybuild = "1"
