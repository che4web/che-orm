name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo run -p che-orm-examples --bin manage --locked -- schema
      - run: cargo run -p che-sync --example offline --locked
      - run: cargo package -p che-orm-macros -p che-orm -p che-sync-protocol -p che-sync --locked

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: che_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/che_orm_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p che-orm --locked --no-default-features --features postgres
      - run: cargo test -p che-orm --locked --no-default-features --features postgres --test runtime -- --ignored
      - run: cargo test -p che-sync --locked --no-default-features --features postgres
      - run: cargo test -p che-sync --locked --no-default-features --features postgres --test runtime --test model_roles -- --ignored

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p che-orm -p che-sync --all-targets --locked --no-default-features --features postgres
