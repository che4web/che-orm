[package]
name = "che-sync-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Backend-independent offline synchronization protocol for che-orm"
repository = "https://github.com/che4web/che-orm"
documentation = "https://docs.rs/che-sync-protocol"
homepage = "https://github.com/che4web/che-orm"
readme = "README.md"
keywords = ["sync", "offline", "protocol", "serde"]
categories = ["database", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7"] }
time = { version = "0.3", features = ["serde-human-readable", "serde-well-known"] }
