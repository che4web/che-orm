[package]
name = "che-sync-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Backend-independent offline synchronization protocol for che-orm"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v7"] }
time = { version = "0.3", features = ["serde-human-readable"] }
