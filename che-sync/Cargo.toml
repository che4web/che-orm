[package]
name = "che-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Durable offline-first synchronization engine for che-orm"

[features]
default = ["sqlite"]
sqlite = ["che-orm/sqlite"]
postgres = ["che-orm/postgres"]

[dependencies]
che-orm = { path = "..", version = "0.3.0", default-features = false }
che-sync-protocol = { path = "../che-sync-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }

[[example]]
name = "offline"
required-features = ["sqlite"]
