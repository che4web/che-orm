[package]
name = "che-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Durable offline-first synchronization engine for che-orm"
repository = "https://github.com/che4web/che-orm"
documentation = "https://docs.rs/che-sync"
homepage = "https://github.com/che4web/che-orm"
readme = "README.md"
keywords = ["sync", "offline", "sqlite", "postgres", "orm"]
categories = ["database"]

[package.metadata.docs.rs]
no-default-features = true
features = ["sqlite"]

[features]
default = ["sqlite"]
sqlite = ["che-orm/sqlite"]
postgres = ["che-orm/postgres"]

[dependencies]
che-orm = { path = "..", version = "0.3.2", default-features = false }
che-sync-protocol = { path = "../che-sync-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }

[[example]]
name = "offline"

[[example]]
name = "model_log"
required-features = ["sqlite"]
