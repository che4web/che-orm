[package]
name = "che-orm"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE-MIT"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Experimental Rust ORM with compile-time SQLite or PostgreSQL backends"
readme = "README.md"
documentation = "https://docs.rs/che-orm"
keywords = ["orm", "sqlite", "database", "migrations", "django"]
categories = ["database"]

[package.metadata.docs.rs]
features = ["sqlite", "migration-native"]

[features]
default = ["sqlite", "migration-native"]
sqlite = ["sqlx/sqlite", "che-orm-macros/sqlite"]
postgres = ["sqlx/postgres", "che-orm-macros/postgres"]
migration-native = ["sqlite"]
migration-atlas = []

[dependencies]
che-orm-macros.workspace = true
chrono.workspace = true
cap-std.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
trybuild.workspace = true
