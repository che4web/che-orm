[package]
name = "che-orm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Migration CLI for che-orm"
readme = "README.md"
documentation = "https://docs.rs/che-orm-cli"
keywords = ["orm", "sqlite", "migrations", "cli"]
categories = ["command-line-utilities", "database"]

[features]
default = ["sqlite", "migration-native"]
sqlite = ["che-orm/sqlite"]
postgres = ["che-orm/postgres"]
migration-native = ["che-orm/migration-native"]
migration-atlas = ["che-orm/migration-atlas"]

[[bin]]
name = "che-orm"
path = "src/main.rs"

[dependencies]
che-orm = { workspace = true, default-features = false }
clap.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
